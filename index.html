      <style>
:root {
  --navy: #0c2340;
  --navy-deep: #071628;
  --gold: #c9a227;
  --gold-soft: #e8d48a;
  --ink: #1a2433;
  --muted: #5c6b7a;
  --line: #d5dde6;
  --paper: #f4f7fa;
  --white: #ffffff;
  --input: #eef4fb;
  --ok: #1f6b4a;
  --shadow: 0 18px 50px rgba(12, 35, 64, 0.12);
  --radius: 14px;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(ellipse 90% 55% at 10% -10%, rgba(201, 162, 39, 0.18), transparent 55%),
    radial-gradient(ellipse 70% 50% at 100% 0%, rgba(12, 35, 64, 0.16), transparent 50%),
    linear-gradient(165deg, #e8eef5 0%, var(--paper) 45%, #eef2f6 100%);
}

button,
input,
select {
  font: inherit;
}

#app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 28px 20px 64px;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}

.brand {
  display: grid;
  gap: 4px;
}

.brand-logo {
  height: 56px;
  width: auto;
  max-width: min(340px, 70vw);
  margin-bottom: 2px;
}

.brand p {
  margin: 0;
  color: var(--muted);
  font-size: 0.98rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.btn {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 11px 18px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: var(--navy);
  color: var(--white);
  box-shadow: 0 10px 24px rgba(12, 35, 64, 0.22);
}

.btn-primary:hover {
  background: var(--navy-deep);
}

.btn-ghost {
  background: rgba(255, 255, 255, 0.72);
  color: var(--navy);
  border: 1px solid var(--line);
}

.layout {
  display: grid;
  grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}

.panel,
.preview {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(213, 221, 230, 0.9);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow);
}

.panel {
  padding: 22px;
  position: sticky;
  top: 16px;
}

.panel h2,
.section-title {
  margin: 0 0 14px;
  font-family: var(--font-display);
  font-size: 1.55rem;
  color: var(--navy);
  font-weight: 600;
}

.group {
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.group:last-child {
  border-bottom: 0;
  margin-bottom: 0;
  padding-bottom: 0;
}

.group-label {
  margin: 0 0 10px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
}

.fields {
  display: grid;
  gap: 10px;
}

.fields.two {
  grid-template-columns: 1fr 1fr;
}

label {
  display: grid;
  gap: 5px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}

input,
select {
  width: 100%;
  border: 1px solid #c9d6e4;
  background: var(--input);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input:focus,
select:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(12, 35, 64, 0.12);
  background: #fff;
}

input[readonly] {
  background: #e8eef5;
  color: var(--navy);
  font-weight: 700;
  cursor: default;
}

.preview {
  padding: 0;
  overflow: hidden;
}

.sheet {
  background: var(--white);
  padding: 36px 40px 28px;
  min-height: 100%;
}

.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--navy);
  margin-bottom: 22px;
}

.sheet-brand {
  display: flex;
  align-items: center;
}

.sheet-logo {
  height: 50px;
  width: auto;
  max-width: 300px;
}

.sheet-meta {
  text-align: right;
}

.sheet-meta .label {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.sheet-meta .value {
  font-weight: 700;
  color: var(--navy);
  font-size: 1.05rem;
}

.sheet-meta .doc-title {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 600;
  color: var(--navy);
  margin-bottom: 8px;
}

.block {
  margin-bottom: 18px;
}

.block h3 {
  margin: 0 0 10px;
  padding: 7px 10px;
  background: var(--navy);
  color: var(--white);
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 700;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
}

.grid-1 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}

.kv {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 8px;
  padding: 4px 10px;
  border-bottom: 1px solid #edf1f5;
}

.kv .k {
  color: var(--muted);
  font-size: 0.86rem;
}

.kv .v {
  font-weight: 600;
  color: var(--ink);
  text-align: right;
  word-break: break-word;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.95rem;
}

.table th,
.table td {
  padding: 9px 10px;
  border-bottom: 1px solid #e7edf3;
  text-align: left;
}

.table th {
  color: var(--muted);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
}

.table td.num,
.table th.num {
  text-align: right;
}

.table .highlight td {
  background: #f7fafc;
  font-weight: 700;
  color: var(--navy);
}

.uf-note {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  padding: 0 10px;
  color: var(--muted);
  font-size: 0.86rem;
}

.terms {
  margin: 0;
  padding: 0 0 0 18px;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.45;
}

.terms li {
  margin-bottom: 4px;
}

.sheet-foot {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  text-align: center;
  color: var(--muted);
  font-size: 0.82rem;
}

.hint {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.35;
}

.hint strong {
  color: var(--navy);
}

.tipo-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.tipo-card {
  appearance: none;
  width: 100%;
  border: 1px solid #c5d0de;
  background:
    linear-gradient(180deg, #ffffff 0%, #f7fafc 100%);
  border-radius: 14px;
  padding: 14px 14px 14px 12px;
  text-align: left;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: center;
  transition:
    border-color 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.18s ease;
}

.tipo-card:hover {
  transform: translateY(-1px);
  border-color: #9eb0c5;
  box-shadow: 0 10px 22px rgba(12, 35, 64, 0.08);
}

.tipo-card.is-active {
  border-color: var(--navy);
  background:
    linear-gradient(180deg, #f4f8fc 0%, #e8eef6 100%);
  box-shadow:
    inset 3px 0 0 var(--gold),
    0 12px 26px rgba(12, 35, 64, 0.12);
}

.tipo-radio {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #9eb0c5;
  background: #fff;
  position: relative;
  flex-shrink: 0;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.tipo-card.is-active .tipo-radio {
  border-color: var(--navy);
  background: var(--navy);
  box-shadow: inset 0 0 0 3px #fff;
}

.tipo-body {
  display: grid;
  gap: 6px;
  min-width: 0;
}

.tipo-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.tipo-name {
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 600;
  color: var(--navy);
  line-height: 1.1;
}

.tipo-prices {
  display: grid;
  justify-items: end;
  gap: 2px;
  text-align: right;
}

.tipo-precio {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--navy);
  white-space: nowrap;
  letter-spacing: 0.01em;
}

.tipo-precio-clp {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}

.tipo-card.is-active .tipo-precio {
  color: var(--navy-deep);
}

.tipo-card.is-active .tipo-precio-clp {
  color: var(--navy);
}

.tipo-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  color: var(--muted);
  font-size: 0.8rem;
  font-weight: 500;
}

.tipo-m2 {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(12, 35, 64, 0.07);
  color: var(--navy);
  font-weight: 700;
  font-size: 0.76rem;
}

.tipo-card.is-active .tipo-m2 {
  background: rgba(201, 162, 39, 0.22);
  color: var(--navy-deep);
}

.tipo-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #b0bdcb;
}

.tipo-extras {
  color: var(--muted);
}

.uf-box {
  display: grid;
  gap: 8px;
  padding: 12px;
  border-radius: 12px;
  background: linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
  border: 1px solid #d5dde6;
}

.uf-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: end;
}

.uf-field {
  display: grid;
  gap: 5px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}

.uf-status {
  font-size: 0.78rem;
  color: var(--muted);
}

.uf-status.is-loading {
  color: var(--navy);
}

.uf-status.is-ok {
  color: var(--ok);
  font-weight: 600;
}

.uf-status.is-error {
  color: #9b2c2c;
  font-weight: 600;
}

.btn-small {
  padding: 10px 14px;
  font-size: 0.82rem;
}

.price-stack {
  display: grid;
  gap: 2px;
  justify-items: end;
}

.price-uf {
  font-weight: 700;
  color: var(--ink);
}

.price-clp {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muted);
}

.price-clp.is-muted {
  font-weight: 500;
  font-style: italic;
}

.pie-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
}

.pie-presets {
  display: flex;
  gap: 6px;
}

.chip {
  appearance: none;
  border: 1px solid #c9d6e4;
  background: #fff;
  color: var(--navy);
  border-radius: 999px;
  padding: 8px 10px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

.chip.is-active,
.chip.is-std.is-active {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}

.soft {
  color: var(--muted);
  font-weight: 500;
}

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(31, 107, 74, 0.1);
  color: var(--ok);
  font-size: 0.78rem;
  font-weight: 700;
}

.live-badge::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 1.6s ease infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.45;
    transform: scale(0.85);
  }
}

.bottombar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px 16px;
  margin-top: 22px;
  padding: 18px 22px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(213, 221, 230, 0.9);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow);
}

.bottombar-hint {
  margin: 0;
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1.35;
  max-width: 340px;
}

.bottombar-hint.is-loading {
  color: var(--navy);
  font-weight: 600;
}

.bottombar-hint.is-ok {
  color: var(--ok);
  font-weight: 600;
}

.bottombar-hint.is-error {
  color: #9b2c2c;
  font-weight: 600;
}

.btn:disabled {
  opacity: 0.6;
  cursor: progress;
  transform: none;
}

.bottombar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.btn-print-lg {
  padding: 14px 26px;
  font-size: 1rem;
}

.btn-gold {
  background: var(--gold);
  color: var(--navy);
  box-shadow: 0 10px 24px rgba(201, 162, 39, 0.3);
}

.btn-gold:hover {
  background: #b8931f;
  color: #fff;
}

@media (max-width: 980px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .panel {
    position: static;
  }

  .fields.two,
  .pie-row {
    grid-template-columns: 1fr;
  }

  .topbar {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 600px) {
  #app {
    padding: 16px 12px 48px;
  }

  .brand-logo {
    height: 44px;
  }

  .topbar {
    gap: 12px;
    margin-bottom: 20px;
  }

  .layout {
    gap: 16px;
  }

  .panel {
    padding: 16px;
  }

  .sheet {
    padding: 22px 16px;
  }

  /* Cabecera de la hoja apilada para que no se corte */
  .sheet-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .sheet-meta {
    text-align: left;
  }

  .sheet-logo {
    height: 42px;
    max-width: 100%;
  }

  /* Datos en una sola columna: nada de palabras cortadas */
  .grid-2 {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .kv {
    padding: 7px 2px;
  }

  .uf-note {
    flex-direction: column;
    gap: 4px;
  }

  .table {
    font-size: 0.82rem;
  }

  .table th,
  .table td {
    padding: 7px 6px;
  }

  .table th {
    font-size: 0.66rem;
  }

  /* Barra inferior: nota arriba, botones apilados a ancho completo */
  .bottombar {
    flex-direction: column;
    align-items: stretch;
    padding: 16px 14px;
  }

  .bottombar-hint {
    max-width: none;
    text-align: center;
  }

  .bottombar-actions {
    flex-direction: column-reverse;
    align-items: stretch;
    width: 100%;
  }

  .bottombar-actions .btn {
    width: 100%;
  }
}

@media print {
  @page {
    size: A4;
    margin: 9mm;
  }

  body {
    background: #fff;
  }

  #app {
    max-width: none;
    padding: 0;
  }

  .topbar,
  .panel,
  .live-badge,
  .bottombar {
    display: none !important;
  }

  .layout {
    display: block;
  }

  .preview {
    border: 0;
    box-shadow: none;
    border-radius: 0;
    background: #fff;
  }

  .sheet {
    padding: 0;
    min-height: 0;
  }

  /* Mantener los fondos de color del diseño en el PDF */
  .sheet-head,
  .block h3,
  .table .highlight td,
  .uf-note,
  .tipo-m2 {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Compactar para caber en una sola página */
  .sheet-head {
    padding-bottom: 8px;
    margin-bottom: 10px;
  }

  .sheet-logo {
    max-height: 42px;
  }

  .sheet-brand {
    font-size: 1.5rem;
  }

  .sheet-meta .doc-title {
    font-size: 1.35rem;
    margin-bottom: 4px;
  }

  .sheet-meta .value {
    font-size: 0.95rem;
  }

  .block {
    margin-bottom: 8px;
    break-inside: avoid;
  }

  .block h3 {
    padding: 4px 8px;
    margin-bottom: 6px;
    font-size: 0.7rem;
  }

  .grid-2 {
    gap: 1px 22px;
  }

  .kv {
    padding: 2px 8px;
  }

  .kv .k {
    font-size: 0.76rem;
  }

  .kv .v {
    font-size: 0.78rem;
  }

  .table {
    font-size: 0.82rem;
  }

  .table th,
  .table td {
    padding: 4px 8px;
  }

  .table th {
    font-size: 0.68rem;
  }

  .uf-note {
    font-size: 0.76rem;
    margin-bottom: 6px;
  }

  .terms {
    font-size: 0.66rem;
    line-height: 1.28;
    column-count: 2;
    column-gap: 20px;
    padding-left: 16px;
  }

  .terms li {
    margin-bottom: 2px;
    break-inside: avoid;
  }

  .sheet-foot {
    margin-top: 10px;
    padding-top: 8px;
    font-size: 0.72rem;
  }
}

    <div id="app"></div>
    <script type="module">

const PRECIO_UF_M2 = 90;
const PIE_MIN = 10;
const PIE_STD = 15;
const DESC_MAX = 2; // tope de descuento (%)
const BALLOON_MAX = 35; // tope de cuota final / balloon (%)
const PIE_MIN_BALLOON = 15; // cuota inicial mínima cuando hay balloon (%)

/** Correo del CRM (Kommo) que siempre va en copia (CC) al enviar la cotización. */
const CRM_EMAIL = "vitalisuites@mail.kommo.com";

/** URL del mailer PHP en tu hosting que envía el correo con el PDF adjunto
 *  desde cotizaciones@vitalisuites.com (CC: CRM + vendedor).

function todayInputDate() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function readCorrelativoState() {
  const year = new Date().getFullYear();
  try {
    const raw = localStorage.getItem(COT_STORAGE_KEY);
    if (!raw) return { year, seq: 0 };
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.year !== year) return { year, seq: 0 };
    return { year, seq: Number(parsed.seq) || 0 };
  } catch {
    return { year, seq: 0 };
  }
}

function formatCorrelativo(year, seq) {
  return `COT-${year}-${String(seq).padStart(3, "0")}`;
}

/** Asigna y persiste el siguiente N° correlativo del año */
function nextCorrelativo() {
  const state = readCorrelativoState();
  const seq = state.seq + 1;
  localStorage.setItem(COT_STORAGE_KEY, JSON.stringify({ year: state.year, seq }));
  return formatCorrelativo(state.year, seq);
}

const BORRADOR = "Borrador";

/** Pide el siguiente N° al contador compartido del servidor */
async function pedirCorrelativoServidor() {
  const fd = new FormData();
  fd.append("token", MAILER_TOKEN);
  const res = await fetch(CORRELATIVO_URL, { method: "POST", body: fd });
  const data = await res.json();
  if (!data.ok || !data.numero) throw new Error(data.error || "sin numero");
  return data.numero;
}

/** Asigna el N° definitivo al EMITIR (una sola vez por cotización).
 *  Usa el contador del servidor; si falla, cae a numeración local de respaldo. */
async function asegurarNumero(form) {
  const el = form.elements.namedItem("nCotizacion");
  if (/^COT-\d{4}-\d+/.test(el.value)) return el.value; // ya asignado
  let numero;
  if (CORRELATIVO_URL) {
    try {
      numero = await pedirCorrelativoServidor();
    } catch (e) {
      console.warn("Correlativo del servidor no disponible, uso local", e);
      numero = nextCorrelativo();
    }
  } else {
    numero = nextCorrelativo();
  }
  el.value = numero;
  return numero;
}

/** Excel ROUND half-away-from-zero */
function excelRound(value, digits = 2) {
  const factor = 10 ** digits;
  return (Math.sign(value) * Math.round(Math.abs(value) * factor)) / factor;
}

function formatUf(n, digits = 2) {
  return `${new Intl.NumberFormat("es-CL", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  }).format(n)} UF`;
}

function formatMoney(n) {
  return new Intl.NumberFormat("es-CL", {
    style: "currency",
    currency: "CLP",
    maximumFractionDigits: 0,
  }).format(Math.round(n));
}

function formatPct(n) {
  return `${new Intl.NumberFormat("es-CL", {
    minimumFractionDigits: 1,
    maximumFractionDigits: 1,
  }).format(n)}%`;
}

function formatM2(n) {
  return `${new Intl.NumberFormat("es-CL", {
    minimumFractionDigits: 1,
    maximumFractionDigits: 1,
  }).format(n)} m²`;
}

function formatDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString("es-CL", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  });
}

function formatUfFecha(iso) {
  if (!iso) return "";
  const datePart = String(iso).slice(0, 10);
  const [y, m, d] = datePart.split("-").map(Number);
  if (!y || !m || !d) return "";
  return new Date(y, m - 1, d).toLocaleDateString("es-CL", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
  });
}

function getTipologia(id) {
  return TIPOLOGIAS[id] || null;
}

function getHabitar(id) {
  return HABITARES[id] || null;
}

function precioFromTipologia(tipo) {
  if (!tipo) return 0;
  return excelRound(tipo.superficie * PRECIO_UF_M2, 2);
}

function calc(state) {
  const tipo = getTipologia(state.tipologiaId);
  const habitar = getHabitar(state.habitarId);
  const precioBase = precioFromTipologia(tipo);

  // Descuento (% del precio de venta), tope DESC_MAX
  let descPctNum = Number(state.descPct) || 0;
  if (descPctNum < 0) descPctNum = 0;
  if (descPctNum > DESC_MAX) descPctNum = DESC_MAX;
  const descUf = excelRound(precioBase * (descPctNum / 100), 2);
  const precio = excelRound(precioBase - descUf, 2); // precio final (con descuento)

  // Cuota final / balloon (% del precio), tope BALLOON_MAX
  let balloonPctNum = Number(state.balloonPct) || 0;
  if (balloonPctNum < 0) balloonPctNum = 0;
  if (balloonPctNum > BALLOON_MAX) balloonPctNum = BALLOON_MAX;

  // Cuota inicial: mínimo PIE_MIN, o PIE_MIN_BALLOON si hay balloon
  const pieMin = balloonPctNum > 0 ? PIE_MIN_BALLOON : PIE_MIN;
  let piePctNum = Number(state.piePct);
  if (!Number.isFinite(piePctNum)) piePctNum = PIE_STD;
  if (piePctNum < pieMin) piePctNum = pieMin;
  if (piePctNum > 100) piePctNum = 100;
  const piePct = piePctNum / 100;
  const uf = Number(state.uf) || 0;
  const plazo = habitar ? habitar.plazoAnios : 0;
  const cuotas = habitar ? habitar.cuotas : 0;
  const pieUf = excelRound(precio * piePct, 2);
  const saldo = excelRound(precio - pieUf, 2);

  // Reserva (monto fijo en pesos) que se abona a la cuota inicial
  const pieClp = pieUf * uf;
  let reservaClp = Number(state.reservaClp) || 0;
  if (reservaClp < 0) reservaClp = 0;
  if (uf > 0 && reservaClp > pieClp) reservaClp = pieClp; // no puede exceder la cuota inicial
  const reservaUf = uf > 0 ? excelRound(reservaClp / uf, 2) : 0;
  const saldoPieUf = excelRound(pieUf - reservaUf, 2);
  const saldoPieClp = pieClp - reservaClp;
  const hasReserva = reservaClp > 0;

  // El balloon se descuenta del saldo y se paga al final
  let balloonUf = excelRound(precio * (balloonPctNum / 100), 2);
  if (balloonUf > saldo) balloonUf = saldo; // no puede exceder el saldo
  const saldoEnCuotas = excelRound(saldo - balloonUf, 2);
  const cuotaUf = cuotas > 0 && precio > 0 ? excelRound(saldoEnCuotas / cuotas, 2) : 0;

  return {
    tipo,
    habitar,
    anioEntrega: habitar ? habitar.anioEntrega : "",
    plazoAnios: plazo,
    precioBaseUf: precioBase,
    descPct: descPctNum,
    descUf,
    hasDescuento: descPctNum > 0 && descUf > 0,
    precioUf: precio,
    piePct: piePctNum,
    pieUf,
    saldo,
    cuotas,
    cuotaUf,
    balloonPct: balloonPctNum,
    balloonUf,
    hasBalloon: balloonPctNum > 0 && balloonUf > 0,
    reservaClp,
    reservaUf,
    saldoPieUf,
    saldoPieClp,
    hasReserva,
    precioBaseClp: precioBase * uf,
    descClp: descUf * uf,
    precioClp: precio * uf,
    pieClp: pieUf * uf,
    saldoClp: saldo * uf,
    cuotaClp: cuotaUf * uf,
    balloonClp: balloonUf * uf,
    uf,
    precioM2: PRECIO_UF_M2,
    hasUf: uf > 0,
  };
}

function ufStatusHtml() {

    return `<span class="uf-status is-ok">UF del día · ${formatUfFecha(ufMeta.fecha)} · fuente mindicador.cl</span>`;

  if (ufMeta.status === "error") {
    return `<span class="uf-status is-error">${ufMeta.message || "No se pudo cargar la UF. Ingresa el valor manualmente."}</span>`;

}

/** Datos del ejecutivo(a) recordados en este navegador */
function readVendedor() {
  try {
    const raw = localStorage.getItem(VENDEDOR_STORAGE_KEY);
    if (!raw) return {};
    const p = JSON.parse(raw) || {};
    return { ejecutivo: p.ejecutivo || "", ejecutivoCorreo: p.ejecutivoCorreo || "" };
  } catch {
    return {};
  }
}

function saveVendedor(state) {
  try {
    localStorage.setItem(
      VENDEDOR_STORAGE_KEY,
      JSON.stringify({
        ejecutivo: state.ejecutivo || "",
        ejecutivoCorreo: state.ejecutivoCorreo || "",
      })
    );
  } catch {
    /* almacenamiento no disponible */
  }
}

function readForm(form) {
  const data = new FormData(form);
  const state = {};
  for (const [key, value] of data.entries()) {
    if (["uf", "piePct", "descPct", "balloonPct", "reservaClp"].includes(key)) {
      state[key] = value === "" ? "" : Number(value);
    } else {
      state[key] = value;
    }
  }
  return state;
}

function fillForm(form, state) {
  for (const [key, value] of Object.entries(state)) {
    const el = form.elements.namedItem(key);
    if (!el) continue;
    el.value = value ?? "";
  }
}

async function fetchUfDelDia() {
  ufMeta = { ...ufMeta, status: "loading", message: "" };
  updateUfStatus();

  // En desarrollo (localhost) usamos el proxy de Vite para evitar CORS;
  // en el sitio publicado vamos directo a mindicador.cl (sin 404 ni latencia extra).
  const isLocalhost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  const endpoints = isLocalhost
    ? ["/api/mindicador", "https://mindicador.cl/api"]
    : ["https://mindicador.cl/api"];
  let lastError = null;

  for (const url of endpoints) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const valor = data?.uf?.valor;
      const fecha = data?.uf?.fecha || data?.fecha || null;
      if (typeof valor !== "number" || !Number.isFinite(valor)) {
        throw new Error("Respuesta UF inválida");
      }
      ufMeta = {
        valor,
        fecha,
        status: "ok",
        message: "",
      };
      return valor;
    } catch (err) {
      lastError = err;
    }
  }

  ufMeta = {
    valor: ufMeta.valor,
    fecha: ufMeta.fecha,
    status: "error",
    message: "No se pudo cargar la UF del día. Ingresa el valor manualmente.",
  };
  updateUfStatus();
  console.warn("UF fetch failed", lastError);
  return null;
}

/** Valida que sea UN solo correo bien formado (sin espacios ni texto extra) */
function esEmailValido(e) {
  return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test((e || "").trim());
}

    if (el) el.focus();

  const subject = `Cotización ${state.nCotizacion} · ${state.proyecto}${

  }`;

  window.location.href = mailto;
}

/** Resolución/calidad del PDF. El PDF se envía como archivo adjunto (multipart),
 *  así que no hay problema de tamaño y podemos usar alta calidad. */
const PDF_SCALE = 2;
const PDF_QUALITY = 0.95;

/** Rasteriza el logo SVG a PNG (data URI). html2canvas no dibuja bien el SVG
 *  del wordmark, así que para el PDF usamos una versión PNG nítida. Se cachea. */
let logoPngCache = null;
async function logoPngDataUri() {
  if (logoPngCache) return logoPngCache;
  const resp = await fetch("logo-vitali.svg", { cache: "force-cache" });
  const svgText = await resp.text();
  const url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
  try {
    logoPngCache = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => {
        const w = 1120;
        const h = Math.round(w * (im.height / im.width)) || 210;
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        resolve(c.toDataURL("image/png"));
      };
      im.onerror = () => reject(new Error("No se pudo rasterizar el logo"));
      im.src = url;
    });
  } finally {
    URL.revokeObjectURL(url);
  }
  return logoPngCache;
}

/** Cuenta las páginas de un PDF (Blob) para validar que sea de 1 sola página. */
async function contarPaginasPdf(blob) {
  try {
    const txt = new TextDecoder("latin1").decode(new Uint8Array(await blob.arrayBuffer()));
    return (txt.match(/\/Type\s*\/Page[^s]/g) || []).length;
  } catch {
    return 0;
  }
}

/** Genera el PDF de la hoja de cotización y devuelve un Blob.
 *  Renderiza el #sheet REAL (no un clon: clonar hace que html2canvas salga en
 *  blanco al generar más de una vez sin recargar). Se hace scroll al tope durante
 *  la captura porque html2canvas es sensible al scroll, y se restaura después. */
async function generarPdfBlob(filename) {
  if (typeof window.html2pdf === "undefined") {
    throw new Error("La librería de PDF no está disponible (revisa la conexión).");
  }
  const sheet = document.querySelector("#sheet");
  const logo = sheet.querySelector(".sheet-logo");
  const origLogoSrc = logo ? logo.getAttribute("src") : null;
  const savedScroll = window.scrollY;

  const style = document.createElement("style");
  style.textContent = PDF_COMPACT_CSS;
  document.head.appendChild(style);

  // Sustituir el logo SVG por PNG para que html2canvas lo dibuje bien
  if (logo) {
    try {
      logo.setAttribute("src", await logoPngDataUri());
    } catch (e) {
      console.warn("Logo PNG no disponible, se usa el SVG", e);
    }
  }

  const opt = {
    margin: 9,
    filename,
    image: { type: "jpeg", quality: PDF_QUALITY },
    html2canvas: { scale: PDF_SCALE, backgroundColor: "#ffffff", useCORS: true },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
  };

  try {
    let blob = null;
    // Reintenta hasta obtener un PDF válido de 1 página. En algunos navegadores
    // html2canvas captura antes de que se aplique el compactado (→ 2 páginas) o
    // el layout no alcanza a asentarse; una espera mayor lo resuelve.
    for (let intento = 1; intento <= 3; intento++) {
      window.scrollTo(0, 0);
      void sheet.offsetHeight; // fuerza recálculo de layout con el estilo compacto
      await new Promise((r) => setTimeout(r, 100 * intento));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      blob = await window.html2pdf().set(opt).from(sheet).outputPdf("blob");
      const paginas = await contarPaginasPdf(blob);
      if (blob && blob.size >= 80000 && paginas === 1) break; // salió bien
      console.warn(`PDF intento ${intento}: size=${blob && blob.size}, paginas=${paginas}`);
    }
    return blob;
  } finally {
    style.remove();
    if (logo && origLogoSrc !== null) logo.setAttribute("src", origLogoSrc);
    window.scrollTo(0, savedScroll);
  }
}

/** Envío automático: genera el PDF y lo manda al Web App de Apps Script,
 *  que envía el correo desde cotizaciones@vitalisuites.com con CC al CRM y al vendedor */
async function enviarAutomatico(form, state, totals, setStatus) {
  if (!totals.tipo) {
    alert("Selecciona una tipología antes de enviar la cotización.");
    return;
  }
  const to = (state.correo || "").trim();
  if (!to) {
    alert("Ingresa el correo electrónico del cliente para enviar la cotización.");
    const el = form.elements.namedItem("correo");
    if (el) el.focus();
    return;
  }

  const sellerEmail = (state.ejecutivoCorreo || "").trim();
  const subject = `Cotización ${state.nCotizacion} · ${state.proyecto}${
    totals.tipo ? " · " + totals.tipo.nombre : ""
  }`;
  const body = buildEmailBody(state, totals);
  const filename = `${state.nCotizacion} - ${totals.tipo.nombre}.pdf`;

  setStatus("Generando PDF y enviando…", "loading");
  try {
    const pdfBlob = await generarPdfBlob(filename);

    // Red de seguridad: NUNCA enviar un PDF vacío o de más de 1 página
    // (evita que le llegue una cotización en blanco al cliente).
    const paginas = await contarPaginasPdf(pdfBlob);
    if (!pdfBlob || pdfBlob.size < 80000 || paginas !== 1) {
      console.warn("PDF inválido, no se envía", {
        size: pdfBlob && pdfBlob.size,
        paginas,
        dpr: window.devicePixelRatio,
        win: window.innerWidth + "x" + window.innerHeight,
      });
      setStatus(
        "⚠️ El PDF no se generó bien (no se envió el correo para no mandar una cotización en blanco). Reinténtalo, o usa «Imprimir / PDF» y adjúntalo a mano.",
        "error"
      );
      return;
    }

    // Se envía el PDF como ARCHIVO (multipart/form-data): no dispara preflight y
    // evita el límite de mod_security para cuerpos que no son archivos (~128 KB).
    const fd = new FormData();
    fd.append("token", MAILER_TOKEN);
    fd.append("to", to);
    fd.append("cc", [CRM_EMAIL, sellerEmail].filter(esEmailValido).join(","));
    fd.append("replyTo", esEmailValido(sellerEmail) ? sellerEmail : "");
    // El mailer adjunta la ficha de esta tipología (guardada en su carpeta tipologias/)
    fd.append("tipologiaId", totals.tipo ? totals.tipo.id : "");
    fd.append("subject", subject);
    fd.append("body", body);
    fd.append("pdf", pdfBlob, filename);

    const res = await fetch(MAILER_URL, { method: "POST", body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    setStatus(
      `✅ Cotización enviada a ${to} · copia a CRM${sellerEmail ? " y a ti" : ""}.`,
      "ok"
    );
  } catch (err) {
    console.error("Error al enviar la cotización", err);
    const detalle = err && err.message ? ` (${err.message})` : "";
    setStatus(
      `⚠️ No se pudo enviar${detalle}. Descarga el PDF con «Imprimir / PDF» y envíalo manualmente.`,
      "error"
    );
  }
}

function boot() {
  renderShell();
  const form = document.querySelector("#form");
  const initial = { ...DEFAULTS, ...readVendedor(), nCotizacion: BORRADOR };
  fillForm(form, initial);
  updateTipoUI(form, "");

  const refresh = () => {
    updateHabitarUI(form);
    const state = readForm(form);
    saveVendedor(state);
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.classList.toggle("is-active", Number(chip.dataset.pie) === Number(state.piePct));
    });
    updateTipoUI(form, state.tipologiaId || "");
    renderSheet(state, calc(state));
  };

  const balloonEl = form.elements.namedItem("balloonPct");
  const descEl = form.elements.namedItem("descPct");
  const pieEl = form.elements.namedItem("piePct");

  // Cuota inicial mínima efectiva (15% si hay balloon, si no 10%)
  const pieMinEfectivo = () => ((Number(balloonEl.value) || 0) > 0 ? PIE_MIN_BALLOON : PIE_MIN);

  // Se escribe libre; se ajusta al rango sólo al salir del campo (blur/Enter).
  pieEl.addEventListener("change", () => {
    const min = pieMinEfectivo();
    let v = pieEl.value === "" ? Math.max(PIE_STD, min) : Number(pieEl.value);
    if (!Number.isFinite(v)) v = Math.max(PIE_STD, min);
    if (v < min) v = min;
    if (v > 100) v = 100;
    pieEl.value = String(v);
    refresh();
  });

  descEl.addEventListener("change", () => {
    if (descEl.value === "") return refresh();
    let v = Number(descEl.value);
    if (!Number.isFinite(v) || v < 0) v = 0;
    if (v > DESC_MAX) v = DESC_MAX;
    descEl.value = v ? String(v) : "";
    refresh();
  });

  balloonEl.addEventListener("change", () => {
    if (balloonEl.value !== "") {
      let v = Number(balloonEl.value);
      if (!Number.isFinite(v) || v < 0) v = 0;
      if (v > BALLOON_MAX) v = BALLOON_MAX;
      balloonEl.value = v ? String(v) : "";
    }
    // Si hay balloon, la cuota inicial debe ser mínimo PIE_MIN_BALLOON
    if ((Number(balloonEl.value) || 0) > 0 && (Number(pieEl.value) || 0) < PIE_MIN_BALLOON) {
      pieEl.value = String(PIE_MIN_BALLOON);
    }
    refresh();
  });

  const applyUf = async () => {
    const valor = await fetchUfDelDia();
    updateUfStatus();
    if (valor != null) {
      form.elements.namedItem("uf").value = String(valor);
    }
    refresh();
  };

  form.addEventListener("input", (e) => {
    if (e.target?.name === "uf" && ufMeta.status === "ok") {
      const current = Number(e.target.value);
      if (current !== ufMeta.valor) {
        ufMeta = { ...ufMeta, status: "idle", message: "Valor UF editado manualmente" };
        updateUfStatus();
      }
    }
    refresh();
  });
  form.addEventListener("change", refresh);

  document.querySelector("#tipo-grid").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-tipo]");
    if (!btn) return;
    updateTipoUI(form, btn.dataset.tipo);
    refresh();
  });

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      form.elements.namedItem("piePct").value = chip.dataset.pie;
      refresh();
    });
  });

  const resetCotizacion = () => {
    const ufActual = form.elements.namedItem("uf").value;
    fillForm(form, {
      ...DEFAULTS,
      ...readVendedor(),
      nCotizacion: BORRADOR,
      uf: ufActual,
    });
    updateTipoUI(form, "");
    refresh();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const imprimir = async () => {
    const state = readForm(form);
    if (!calc(state).tipo) {
      alert("Selecciona una tipología antes de imprimir la cotización.");
      return;
    }
    await asegurarNumero(form); // asigna el N° definitivo al emitir
    refresh();
    window.print();
  };

  document.querySelector("#btn-uf").addEventListener("click", () => applyUf());
  document.querySelector("#btn-print").addEventListener("click", imprimir);
  document.querySelector("#btn-print-bottom").addEventListener("click", imprimir);
  document.querySelector("#btn-reset").addEventListener("click", resetCotizacion);
  document.querySelector("#btn-reset-bottom").addEventListener("click", resetCotizacion);

  const hintEl = document.querySelector(".bottombar-hint");
  const setStatus = (msg, kind) => {
    if (!hintEl) return;
    hintEl.textContent = msg;
    hintEl.className = "bottombar-hint" + (kind ? " is-" + kind : "");
  };

  const emailBtns = [
    document.querySelector("#btn-email"),
    document.querySelector("#btn-email-bottom"),
  ].filter(Boolean);

  const enviarCorreo = async () => {
    // Validar antes de asignar el N° (para no gastar números en vano)
    const pre = readForm(form);
    const preTotals = calc(pre);
    if (!preTotals.tipo) {
      alert("Selecciona una tipología antes de enviar la cotización.");
      return;
    }
    if (!esEmailValido(pre.correo)) {
      alert("Ingresa un correo electrónico válido del cliente (un solo correo, sin espacios ni texto extra).");
      const el = form.elements.namedItem("correo");
      if (el) el.focus();
      return;
    }
    // El correo del ejecutivo(a), si se completa, debe ser SOLO un correo válido
    // (evita que se peguen contraseñas u otro texto que rompan el envío).
    const sellerRaw = (pre.ejecutivoCorreo || "").trim();
    if (sellerRaw && !esEmailValido(sellerRaw)) {
      alert(
        "El «Correo del ejecutivo(a)» no es válido. Escribe solo tu correo (sin contraseñas ni texto extra), o déjalo vacío."
      );
      const el = form.elements.namedItem("ejecutivoCorreo");
      if (el) el.focus();
      return;
    }
    emailBtns.forEach((b) => (b.disabled = true));
    try {
      await asegurarNumero(form); // asigna el N° definitivo al emitir
      refresh();
      const state = readForm(form);
      const totals = calc(state);
      if (!MAILER_URL) {
        // Envío automático no configurado: modo manual (mailto)
        enviarPorCorreo(form, state, totals);
        return;
      }
      await enviarAutomatico(form, state, totals, setStatus);
    } finally {
      emailBtns.forEach((b) => (b.disabled = false));
    }
  };
  emailBtns.forEach((b) => b.addEventListener("click", enviarCorreo));

  refresh();
  applyUf();
}

boot();

    </script>
  </body>
</html>
